<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cafe Corner - Order Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Order & Reserve</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="menu.html">Full Menu</a>
      <a href="order.html">Order Online</a>
      <a href="about.html">About & Contact</a>
    </nav>
  </header>

  <p>Place an online order or book a cozy table at Cafe Corner!</p>

  <form onsubmit="submitOrder(event)">
    <label for="custName">Your Name:</label>
    <input type="text" id="custName" placeholder="Enter your name" required>

    <label for="orderType">Order Type:</label>
    <select id="orderType">
      <option value="Dine-In">Dine-In (Table Reservation)</option>
      <option value="Takeaway">Takeaway / Pickup</option>
    </select>

    <label for="itemSelect">Select Item:</label>
    <select id="itemSelect">
      <option value="320">Strawberry Matcha - Rs. 320</option>
      <option value="380">Rose Vanilla Latte - Rs. 380</option>
      <option value="350">Cup Cakes - Rs. 350</option>
      <option value="290">Butter Croissant - Rs. 290</option>
      <option value="480">Matilda's Cake - Rs. 480</option>
      <option value="520">Strawberry Cheesecake - Rs. 520</option>
    </select>

    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" value="1" min="1" max="10" required>

    <label for="notes">Special Instructions:</label>
    <textarea id="notes" rows="3" placeholder="Less ice, extra cherry, window seat..."></textarea>

    <button type="submit">Confirm Order</button>
  </form>

  <footer>
    <p>Created by Meerab Malik | Roll No: 26i-3107 | Section: C</p>
  </footer>

  <script>
    function submitOrder(event) {
      event.preventDefault();
      const name = document.getElementById("custName").value;
      const type = document.getElementById("orderType").value;
      const price = parseInt(document.getElementById("itemSelect").value);
      const qty = parseInt(document.getElementById("quantity").value);
      const total = price * qty;

      window.alert(
        "Thank you, " + name + "!\n" +
        "Order Type: " + type + "\n" +
        "Total Bill: Rs. " + total + "\n" +
        "Your Cafe Corner treat is being prepared!"
      );
    }
  </script>

</body>
</html>
